[package]
name = "versoview"
version = "0.1.0"
edition = "2024"
description = "Out-of-process versoview server that speaks the Verso IPC protocol over framed stdio"
license = "MIT OR Apache-2.0"

[[bin]]
name = "versoview"
path = "src/main.rs"

[features]
default = []
servo-engine = []
zero_copy = ["verso-standalone/zero_copy", "dep:nix", "dep:memmap2"]

[dependencies]
# Use the local verso-standalone crate for protocol and transport definitions.
verso-standalone = { path = "..", features = ["versoview-runtime"] }

# Async runtime and utilities
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
bytes = "1.10.1"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
bincode = { version = "2.0.1", features = ["serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", optional = true, features = ["socket", "uio"] }
memmap2 = { version = "0.9.8", optional = true }

[lints.clippy]
needless_doctest_main = "allow"
