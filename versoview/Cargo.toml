[package]
name = "versoview"
version = "0.1.0"
edition = "2024"
description = "Out-of-process versoview server that speaks the Verso IPC protocol over framed stdio"
license = "MIT OR Apache-2.0"

[[bin]]
name = "versoview"
path = "src/main.rs"

[features]
default = []
servo-engine = ["dep:libservo", "dep:image"]
zero_copy = ["verso-standalone/zero_copy", "dep:nix", "dep:memmap2"]
dioxus_engine = ["dep:dioxus", "dep:dioxus-html", "dep:dioxus-ssr", "dep:image"]
tauri_ipc = ["dep:tauri_ipc_adapter"]
tauri_compat_ipc = ["dep:tauri_compat_ipc"]
async-handlers = ["tauri_compat_ipc?/async-handlers"]
window_manager = ["dep:window_manager"]

[dependencies]
# Use the local verso-standalone crate for protocol and transport definitions.
verso-standalone = { path = "..", features = ["versoview-runtime"] }

# Async runtime and utilities
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
bytes = "1.10.1"
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
bincode = { version = "2.0.1", features = ["serde"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Dioxus SSR integration (feature-gated via `dioxus_engine`)
dioxus = { version = "0.6.3", optional = true }
dioxus-html = { version = "0.6.3", optional = true }
dioxus-ssr = { version = "0.6.2", optional = true }

# PNG encoding for frame payloads (feature-gated via `dioxus_engine`)
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
tauri_ipc_adapter = { path = "../tools/tauri_ipc_adapter", optional = true }
tauri_compat_ipc = { path = "../tools/tauri_compat_ipc", optional = true }
window_manager = { path = "../tools/window_manager", optional = true }
libservo = { path = "../../servo/components/servo", optional = true }
[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", optional = true, features = ["socket", "uio"] }
memmap2 = { version = "0.9.8", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
needless_doctest_main = "allow"
