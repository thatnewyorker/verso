[package]
name = "servo_prep"
version = "0.1.0"
edition = "2024"
publish = false
description = "CLI tool to build a local Servo binary and stage it under verso/third_party/servo-binaries with metadata for later use."
license = "MIT OR Apache-2.0"
default-run = "servo_prep"

[dependencies]
anyhow = "1.0.93"
clap = { version = "4.5.18", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.19"
time = { version = "0.3.36", features = ["formatting", "macros"] }
which = "6.0.2"

[lints.clippy]
needless_doctest_main = "allow"
