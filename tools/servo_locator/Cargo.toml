[package]
name = "servo_locator"
version = "0.1.0"
edition = "2024"
publish = false
description = "Helper library to locate a prepared Servo binary under verso/third_party/servo-binaries and read its metadata."
license = "MIT OR Apache-2.0"

[lib]
name = "servo_locator"
path = "src/lib.rs"

[features]
default = []

[dependencies]
anyhow = "1.0.93"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.19"

[lints.clippy]
needless_doctest_main = "allow"
