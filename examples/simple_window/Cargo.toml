[package]
name = "simple_window"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Example app showcasing Verso window_manager: create a window, load about:blank, and invoke a command."

[[bin]]
name = "simple_window"
path = "src/main.rs"

[dependencies]
# Verso runtime helpers and controllers (IPC + winit integration behind features)
verso-standalone = { path = "../..", features = ["versoview-runtime"] }

# Lightweight window + webview builder API
window_manager = { path = "../../tools/window_manager" }

# Tauri-inspired IPC adapter (optional, but used by the example to invoke a command)
tauri_ipc_adapter = { path = "../../tools/tauri_ipc_adapter" }

# Windowing foundation
winit = "0.30.12"

# Utilities for payloads and quick examples
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[lints.clippy]
needless_doctest_main = "allow"
